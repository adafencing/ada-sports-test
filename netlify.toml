# Legacy paths — redirect old bookmarks to login
[[redirects]]
  from = "/coach"
  to = "/login.html"
  status = 301

[[redirects]]
  from = "/coach/*"
  to = "/login.html"
  status = 301

[[redirects]]
  from = "/athlete"
  to = "/login.html"
  status = 301

[[redirects]]
  from = "/athlete/*"
  to = "/login.html"
  status = 301

[[redirects]]
  from = "/athlete/signup.html"
  to = "/login.html"
  status = 301

[[redirects]]
  from = "/coach/signup.html"
  to = "/login.html"
  status = 301

[[redirects]]
  from = "/superadmin/login.html"
  to = "/login.html"
  status = 301

# Catch-all: unknown paths return landing page
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
