[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# Admin and superadmin (role-based, not sport-specific)
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

[[redirects]]
  from = "/superadmin"
  to = "/superadmin/index.html"
  status = 200

[[redirects]]
  from = "/superadmin/*"
  to = "/superadmin/:splat"
  status = 200

# Sport folders — coach desktop, coach mobile, athlete app
[[redirects]]
  from = "/handball/*"
  to = "/handball/:splat"
